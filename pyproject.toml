[project]
name = "risk-resource"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lgoyal6", email = "lakshgoyal06@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "ortools>=9.15.6755",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
